# Example Startup\uhc.cfg for UHC.dll. Every key is explained in the modding guide:
# https://github.com/Gorgorito12/tad-engine-extensions/blob/main/docs/modding-guide.md
#
# Format: one key per line, then its arguments separated by spaces or tabs (the patcher's
# key=value works too). Keys are case-insensitive. A line whose first word starts with # is a
# comment, and so is anything after //. A # later in a line is not a comment: its words would be
# read as arguments. Delete a line, or put # in front of it, to keep the stock behavior.
#
# The values below are examples (the ones this project tests with). Every key is implemented;
# UHC.log reports "applied" or "FAILED" for each enabled key on every start.

# --- Paths -----------------------------------------------------------------------------------
# Read the game data from the mod folder (the exe's folder), not from the install folder in the
# registry. Enable it in every mod folder that has its own data.
ignoreRegistryPath

# --- Limits ----------------------------------------------------------------------------------
# Maximum cards per deck (stock 25). The deck size of each home city level still comes from
# <maxdecksize> in homecitylevels.xml; raise it there too (see the guide).
deckCardCount 40

# Population: buildings provide at most basePop (stock 200) and techs and cards add at most
# extraPop on top (stock 50). The stock hard cap of 250 is removed.
basePop 300
extraPop 100

# Population with decimals: <PopulationCount>0.5</PopulationCount>, <PopulationCapAddition>7.5,
# and decimal amounts in their tech effects, in steps of 1/K (default 10; 100 for 0.25). The
# population counter and the tooltips show the decimals; AI scripts still see whole numbers.
# The limits above stay in whole population. Changes the simulation: every player needs the same
# line, and saved games load correctly only with the same K. Add "log" to log the decimal values
# read and each population effect.
#decimalPopulation 10

# List every AI3\*.personality file in game setup instead of the built-in 14.
noAILimit
# The same list, hooked later in the same function, for cfgs that use this name. noAILimit wins
# if both are set.
#noAILimitV2

# Every <AbstractType> name in this XML file becomes an abstract unit type (protos, techs, auras,
# XS cUnitType<Name>). Default file: data\uhc\customabstracttypes.xml. Changes the data:
# every player needs the same file.
#customAbstractTypes

# Every <CommandType> name in this XML file becomes a command type for protounitcommands.xml and
# the protos' <Command> buttons. Default file: data\uhc\customprotounitcommands.xml. Changes the
# data: every player needs the same file.
#customProtoUnitCommands

# One armor per damage type: several <Armor> tags per proto count, and Armor effects change the
# one their damagetype names. Changes combat: every player needs the same line.
#multiarmor

# Dynamic free units (FreeHomeCityUnit with a negative amount) grow smoothly with game time.
#betterfreedynamicunit

# Gatherers collect on a fixed interval (the data's rate) instead of once per animation loop.
#gatherFix

# Orders do not reset a unit's attack timer; a stun is not cancelled by a moving target;
# foundations whose construction has not started take no damage. Every player needs the same lines.
#rofFix
#stunMovingTargetFix
#noDamageOnUnbuiltFoundations

# Units keep their tactic when knocked out, stunned or building.
#fallenHeroTacticsFix

# Farm gatherers keep their first spot instead of moving around the farm.
#nowalkfarm

# Adds the UI syscall repairWallGlobal(): repair every wall of the local player.
#repairWallGlobal

# Offer every 32-bit display mode at 16 bits too (current drivers report only 32-bit modes).
#compatMode

# Load plugins (.upl files; default: every *.upl in the game folder) and add the XS syscalls
# they register. Every player needs the same plugins.
#customSyscalls
# The cheats those plugins register work in the chat (plugins load with either key).
#customCheats

# These civs (names from civs.xml) count as Asian civs: consulate, export, the wonder age-up
# (wonders whose politiciandata.xml entry has nativeciv="<Civ>"). Every player needs the same
# line. Add "log" to log when a listed civ gets its wonders.
#asianCivs MyCiv

# One selection holds up to this many units (1 to 200; stock 50). Local only.
#selectionLimit 75

# Team 3 and Team 4 in the single-player game setup (the multiplayer lobby is not changed yet).
#enableAllTeams

# These civs get the hero interface of the two-hero civs (Japanese, Indians).
#twoScoutCivs MyCiv

# These civs count as native civs: fire pit dances, council age-up (politiciandata.xml entries
# with nativeciv="<Civ>"). Every player needs the same line.
#nativeCivs MyCiv

# The command panel's native big button also for these civs, and never on these buildings.
#bigButtonCivs MyCiv
#noBigButtonBlds MyBuilding

# Gatherers on these buildings are placed and animated as on a Mill (enableFarmAnim) or a Rice
# Paddy (enableRectFarmAnim). farmingRadius: Index X Z per enableFarmAnim entry (from 1), the area
# its gatherers spread over (stock 4.5 x 4.5). Every player needs the same lines.
#enableFarmAnim MyMill
#enableRectFarmAnim MyPaddy
#farmingRadius 1 8.0 8.0

# Units of this type (default AbstractTrainLimitOne) leave training one at a time, as monks do,
# instead of as one batch. Every player needs the same line.
#trainSingleAbstractType

# These units may start the age-up of a civ that ages up with wonders (see asianCivs). Every player
# needs the same line.
#wonderCivUnitType MyHero

# Five KB syscalls for AI scripts: kbUnitGetCurrentInventory, kbUnitGetInventoryCapacity,
# kbUnitIsInventoryFull, kbUnitGetNumberWorkersIfSeeable and kbUnitGetNumberTargeters.
#kbUnitSyscalls

# Owning one of these buildings counts as owning a Market for trading. Every player needs the
# same line.
#marketUnits MyMarket

# Heroes: Proto Type StringID per unit. Type 1 = the home city's explorer name, 0 = the stock
# name, other values = the home city's first hero name; StringID = the knockout message.
#explorerUnits MyExplorer 1 12345

# --- Home city, politicians and revolutions --------------------------------------------------
# Fame, XP and shipment costs on the politician screens, and Fame/XP icons on home city cards.
# The icons need art from the mod (see the guide).
removeFameRestriction

# A banner for every XPRevolution<Name> tech: ui\ingame\politicians\REV_banner_<Name>.
customRevolutionBanners

# --- Units -----------------------------------------------------------------------------------
# The ConvertGuardian action may target any unit, not only treasure guardians.
removeConversionRestriction

# --- New keys --------------------------------------------------------------------------------
# When the building that holds the home city shipment point is gone and no stock fallback
# building is left (TownCenter, Outpost, FortFrontier, WarHut, Blockhouse, NoblesHut,
# AbstractAgraFort, AbstractDaimyo, ypCastle, ypVillage), use the first alive building of these
# protos, in this order (up to 64). The keyword FirstTC is the player's first town center (the
# unit the placement rules call FirstTC); with startingTC or civFirstTC it can be another
# building, e.g. a civ that starts with a Market: hcShipmentPointFallback FirstTC Barracks Market
hcShipmentPointFallback Barracks Stable ArtilleryDepot Market Church

# Healers whose proto lists this unit type also heal busy units (moving, fighting or doing
# something else). The name is registered as a new abstract unit type if the data does not
# define it.
healNonIdle AbstractHealNonIdle

# A healer's automatic search heals the best of the units the stock rules accept, not the first
# one: units of the listed types first (in this order; types or proto names, up to 8), then the
# lowest HP ratio, the nearest, the lowest unit ID. With no type, the most hurt unit in reach. A
# direct order still heals what the player chose. Changes the simulation: every player needs the
# same line. Add "log" to log the picks (the first 200).
smartHealTargets

# Units whose proto lists this unit type can dodge hits like the Japanese monk: no damage on
# 15 % of the hits, while their player has the tech YPDodge active. The name is registered as a
# new abstract unit type if the data does not define it. Add "log" to log every dodge.
dodgeAnyUnit AbstractDodge

# A dodge chance per unit type: units of this type (a marker, a stock type or a proto name) dodge
# that percent of the hits (0-100, one decimal), with the tech YPDodge active for their player
# ("tech <TechName>" for another tech, "notech" for none), against every hit or only "ranged" or
# "melee" ones. One rule per line; the first rule that matches a hit decides, and a hit no rule
# matches keeps the stock dodge (and dodgeAnyUnit's). Add "log" to log every roll.
#dodgeChance AbstractDodge 25 ranged
#dodgeChance AbstractDodge 10 melee

# The sound set a unit plays when it dodges, or when it lands a critical hit, instead of the
# stock PowerEvade / PowerCriticalStrike. One line per unit type (or proto name); the first
# matching line wins.
dodgeSoundSet AbstractDodge PowerEvade
criticalSoundSet ypMonkChinese PowerCriticalStrike

# <MaxSpread> and <SpreadFactor> are read on every attack (tactics <action> or protoy
# <ProtoAction>; stock ignores them): a miss lands up to min(SpreadFactor x distance, MaxSpread)
# metres away on each axis, instead of the stock min(0.25 x distance, 5). Units whose proto lists
# this unit type scatter every shot like that, whatever their accuracy, and the shot deals its
# area damage (<DamageArea>) where it lands; mark only area attacks such as shotguns.
# InstantBallistics and TargetGround attacks are not affected. Changes the simulation. Add "log"
# to log the values that differ from the stock ones and the first offset shots.
spreadAnyAccuracy AbstractSpreadAnyAccuracy

# Poison: an attack whose <ProtoAction> lists <AttachProtoUnit>X</AttachProtoUnit> keeps damaging
# what it hits, with X's Attaching action every ROF seconds for X's Lifespan. X needs a tactics
# file with an Attaching action (see the guide). The same <ProtoAction> may add
# <AttachMaxStacks>N</AttachMaxStacks>, <AttachSnare>0.5</AttachSnare> and
# <AttachTickText>40FF40</AttachTickText>. Add "log" to log every poison and tick, "noticktext" to
# hide the tick texts on this machine.
damageOverTime

# Train, research and Maintain speed (BuildingWorkRate) follow the proto's current value, so a
# BuildingWorkRate tech also speeds up the buildings (and ForceBuildingData units) that already
# exist; stock only speeds up the ones completed after the tech. Units already queued or in
# training, and the current Maintain cycle, also follow the current TrainPoints (stock keeps the
# value they were queued with). Changes the simulation: every player needs the same setting. Add
# "log" to log each building and unit whose rate or points this changes.
liveBuildingWorkRate

# Techs with <TypeCount> prerequisites (a count of the player's units) react when units are
# created or die, instead of waiting for the player's next house, age-up or tech change. A number
# checks every N world updates instead of every one. Add "log" to log every re-check and a
# summary per game minute. Without TypeCount prerequisites in the techtree it does nothing.
techPrereqRecheck

# Buildings whose proto lists this unit type keep the unit their automatic production (a Maintain
# action: factory cannons, Ottoman Town Center settlers, ...) has finished while their player is
# at the population cap, and spawn it as soon as there is room; stock throws it away and starts
# the cycle again. The name is registered as a new abstract unit type if the data does not define
# it; a proto name works too. Add "log" to log when a building starts and stops waiting.
maintainWaitForPop AbstractMaintainWaitForPop

# Units that a tech (TransformUnit) or a revolution changes into another proto take that proto's
# line of sight; stock keeps the old one. Changes the simulation: every player needs the same
# setting. Add "log" to log every unit transformed.
transformUpdatesLOS

# Ships whose proto lists this unit type (a new marker, a stock type or a proto name) fire from up
# to N muzzles per side in a broadside (BroadsideAttack actions) instead of 6; N is 1 to 255. The
# model's MuzzleR / MuzzleL points still decide how many muzzles there are, and SingleUsePlayer
# attacks keep 1. Without a unit type, every ship. Add "log" to log each broadside set-up.
broadsideMuzzleLimit 11 ypTekkousen

# How many abilities (abilities.xml) the command panel shows per unit, from 6 (stock) to 36.
# Stock asks only for the first 6 of a unit's list, so a 7th never gets a button, even when its
# tech is active and the first 6 are not. Extra buttons wrap to a second row of the Abilities
# page. Add "log" to log each button past the 6th, once per unit.
abilitySlots 12

# The wonder power panel (the global power buttons of the Asian wonders) shows a wonder's first
# available ability that is not a passive aura, so a power listed after an aura in
# abilities.xml gets its button. Stock shows only the first ability. Add "log" to log each
# ability the panel shows past the first.
wonderPanelSkipAuras

# Buildings whose proto lists this unit type start their <Lifespan> (and its AlphaFadeLifespan
# fade-out) when their construction is finished, not when the foundation is placed. The name is
# registered as a new abstract unit type if the data does not define it; "Building" applies it
# to every building with no data change. Add "log" to log every hold and start.
lifespanAfterConstruction AbstractLifespanAfterConstruction

# A socketed building (TradingPost, or a mod's building with <SocketUnitType>) may only be
# placed on a socket owned by Gaia, as the red placement preview already shows. With a unit type
# (or proto name), only sockets of that type follow the rule; without one, every socket does.
# The name is registered as a new abstract unit type if the data does not define it. Add "log"
# to log each refused order. This changes the simulation: every player needs the same line.
gaiaSocketsOnly AbstractGaiaOnlySocket

# Unit hotkeys for buildings the game has no hotkey context for (a mod's new buildings, or
# stock ones such as the Sacred Field). In DefaultKeyMapY.xml, a <context> named
# <ProtoName>Accel becomes that proto's own context: its keys work while a unit of that proto is
# selected, instead of the stock context's. Only units that enter a hotkey context use it: a
# building or any other unit with a <Train> list, a fire pit, or a unit with the
# EnterHotkeyContext flag (give that flag to other units that need one). With the stock keymap nothing changes, and it does not change the
# simulation. Add "log" to log every switch to such a context.
customHotkeyContexts

# A unit hit by a snare (an attack with <TargetSpeedBoost>: 0.65x speed for 3 s) no longer slows
# the group it moves with: the group keeps its pace and does not wait for the unit while the
# snare lasts, and only the hit unit slows. After the snare, a unit left behind is waited for as
# usual. Changes the simulation: every player needs the same setting. Add "log" to log each
# snared member once per snare.
snareOnlyHitUnit

# The tech effect SetTechName: <Effect type='SetTechName' tech='T' newName='ID'
# newRolloverTextID='ID' [newLongRolloverTextID='ID']/> in a tech's <Effects> gives tech T those
# string IDs for the players the effect reaches, and only for them. The alias
# enableTechRenameEffect is read as this key too. Add "log" to log every rename.
techRenameEffect

# A dead unit (a hunt's carcass, a corpse) whose proto lists this unit type leaves no dopple, the
# frozen copy a player keeps seeing in the fog of war: it simply disappears from the fog. Live
# units are still doppled. Only units with <Flag>Doppled</Flag> have dopples; Huntable covers
# every hunt with no data change. Add "log" to log every skipped dopple.
noCorpseDopples Huntable

# The fire pit's Training, XPTrickle, Gathering and Regeneration dances (Fertility, Gift and
# Healing Dance, ...) work for these civs too, not only for XPIroquois, XPSioux, XPAztec and
# XPSPC. Names as in civs.xml. Nothing else about the civs changes. Changes the simulation:
# every player needs the same line. Add "log" to log each player's first use of each kind.
danceBonusCivs Spanish British

# Buildings whose proto lists this unit type can be a player's first town center, the unit the
# placement rules call FirstTC (no building within 65 m of an enemy's, the no-rush rule near a
# team's). Stock only takes a TownCenter, and keeps a dead one. A marked building becomes FirstTC
# when its player has none, or when the old one is gone, dead or has a pending lifespan (e.g.
# a start tech: TownCenter Lifespan 0.5, then a free replacement). The name is registered as a new
# abstract unit type if the data does not define it. Changes the simulation: every player needs
# the same line. Add "log" to log every marked building that becomes FirstTC.
startingTC AbstractStartingTC

# A civ's <firstTC>Proto</firstTC> in civs.xml (inside its <civ>, like <startingunit>) replaces
# the TownCenter that random maps place for its players, and that building is their first town
# center (FirstTC). Not in a Nomad start (rmGetNomadStart()): the map's own start stays. For the
# civ's <townstartingunit> units (settlers, crates), the proto needs
# <Flag>StartingColonyBuilding</Flag> in protoy and a <type maxcount="1">Proto</type> in the
# <starttypes> of placementrules\colonies.xml; without them they come with the first TownCenter
# built. Add FirstTC to hcShipmentPointFallback so that shipments reach the building. AI scripts
# still expect a TownCenter. Changes the simulation: every player needs the same line, civs.xml,
# colonies.xml and protoy, and so does the playback of a recorded game. Add "log" to log every
# substitution.
civFirstTC

# Units that a tech (TransformUnit) or a revolution changes into another proto take that proto's
# resources (InitialResource) when the two protos hold different resource types: a coin crate
# turned into an XP crate gives XP, not gold, and a unit with no resources turned into a crate
# can be gathered. Stock keeps the old resources, and a later conversion zeroes them. "all"
# also resets same-type units (a fattened sheep turned into a cow gets the cow's food) and
# removes the resources of a unit whose new proto has none; "scale" keeps the fraction not yet
# gathered. With a unit type (a new marker, a stock type or a proto name), only transforms into
# protos of that type. Units already gathering a changed target stop and must be re-tasked.
# Changes the simulation: every player needs the same line. Add "log" to log every transform.
transformInventory

# transformspan='<seconds>' on a TransformUnit effect turns the units back when that game time ends.
# The units keep their IDs, and the time survives a saved game. Changes the simulation: every player
# needs the same setting. Add "log" to log the units.
#transformSpan

# A unit whose proto lists this unit type (AbstractDaimyo: the Daimyos and the Shogun) does not
# train while it stands less than this many metres from an enemy's first Town Center (the FirstTC
# of placementrules.xml, which stock keeps 65 m clear of enemy buildings), measured from the unit
# to the building's edge: its queue keeps its progress and resumes when that Town Center is
# destroyed. "near <UnitType>" (up to 4) lists what blocks instead, for example
# "near FirstTC near Barracks"; "near FirstTC" is the default. Your own held units show a red
# warning at most every 8 s: "warn=Too_close!" ('_' for a space) or "warn=<string ID>" sets the
# text, "nowarn" turns it off. Changes the simulation: every player needs the same line (the
# warning options may differ). Add "log" to log every pause, resume and warning.
noTrainNearEnemyTC 65 AbstractDaimyo

# Units whose proto lists this unit type (a new marker, a stock type or a proto name; several may
# be listed) show InitialHitpoints as 100 % of their HP, not MaxHitpoints: a fresh unit has a full
# bar and 150/150, and a unit healed above it (MaxHitpoints 165) a full bar and 165/150. For a mod
# whose MaxHitpoints is above InitialHitpoints (overheal). The floating bars, the selection group
# bar, Group Health and the HP texts change; healing, AI and triggers still use MaxHitpoints, so it
# does not change the simulation and players may set it differently. The name is registered as a
# new abstract unit type if the data does not define it. Add "log" to log the first unit of each
# proto it applies to. Add "segment" to show the HP above 100 % Overwatch style: an orange segment
# over the right end of the full floating bar and an orange HP text in the unit panel;
# "segment=RRGGBB" picks another colour (hex). With "segment", the bar under the portrait shows it
# too, in a game texture; "bar=<texture>" picks another. Add "stat" for an "Overheal 15/15" row in the unit information panel;
# "stat=<Label>" names it (one word, "_" for a space) or takes a string table ID ("stat=90001").
overhealHitpointBars AbstractOverheal

# Needs overhealHitpointBars. Only healers whose proto lists this unit type (a new marker, a stock
# type or a proto name; several may be listed) heal its marked units above their InitialHitpoints,
# up to MaxHitpoints. Every other healer stops there (its heal action ends and its search skips
# such units), and so do regeneration, dances, area heals, powers and triggers that add HP.
# Changes the simulation: every player needs the same line. Add "log" to log the first capped heal
# and the first source heal of each proto.
#overhealSources AbstractOverhealer

# Needs overhealHitpointBars. Overwatch-style decay: marked units above their InitialHitpoints lose
# this many HP per second of game time ("1%" = 1 % of InitialHitpoints per second), starting this
# many seconds after their last heal above it (regeneration does not delay it), down to
# InitialHitpoints and never below. Unit types after the delay limit it to units of those types.
# Changes the simulation: every player needs the same line. Add "log" to log the first decay of
# each proto.
#overhealDecay 2 3

# The stat panel shows a gathering unit's rate per second after its HP row
# ("Food (icon): 0.84/s"), and the data ref {currentUnitGatherRateString} returns "Food 0.84/s"
# for a formatText gadget. With a unit type (or proto name), only units of that type get the
# row; the data ref works for any unit. <Flag>DoNotShowAutoGatherRate</Flag> hides the row for a
# proto. UI only: players may set it differently. Add "log" to log each unit's first rate per
# resource.
showGatherRate

# A unit's rate for a target is its rate for that proto if it has one, else its rate for an abstract
# type of the target, and a WorkRate effect changes only the rate it names. With this key a WorkRate
# effect on a listed abstract type (default AbstractMine, up to 8) also changes the rates the unit has
# for the protos of that type. A tech that names the type and such a proto counts twice on that proto.
# Changes the simulation: every player needs the same setting. "log=<Proto>" logs that unit's changes;
# plain "log" logs every unit's and is slow.
#workRateByAbstractType

# <ScaleByContainedUnits> also works on AutoGather actions: the rate is multiplied by the units inside,
# at most <DamageFactorCap> when the action has one. With nobody inside the rate is 0. Changes the
# simulation: every player needs the same setting.
#autoGatherScaleByContained

# An AutoRangedModify action with <ModifyType>UnitResource</ModifyType> gathers from the units around it:
# <ModifyAmount> per second per target, of <ModifyAbstractType> or <ModifyProtoID>, at most
# <ModifyTargetLimit> targets, within <MaxRange>; the owner's units, and Gaia's with <TargetGaia>1. Changes
# the simulation: every player needs the same setting. Add "log" to log the first takes.
#unitResourceAuras

# Seven more names for <ModifyType>: MineGatherRate (AbstractMine), TreeGatherRate (Tree), FarmingGatherRate
# (AbstractFarm), NaturalFoodGatherRate (food from anything else), and FoodGatherRate, WoodGatherRate and
# GoldGatherRate (that resource). Changes the simulation: every player needs the same setting. Add "log" to
# log the first factors.
#resourceGatherAuras

# Only trickles and the rates of units may take the listed stockpiles (Food, Wood, Gold; none listed: the three) below
# 0: a negative ResourceTrickleRate with a negative MinimumResourceTrickleRate, a negative AutoGather or a negative gather
# rate. Tech effects, triggers and costs stop at 0, or at the debt already there. Nothing can be paid while in debt.
# Changes the simulation: every player needs the same setting. Add "log" to log the first values below 0.
#resourceDebt

# A tech effect type='Data' subtype='CostEscalation' changes a proto's <CostEscalation>, with any
# relativity, on a ProtoUnit target. Changes the simulation: every player needs the same setting.
# Add "log" to log each change.
#costEscalationTechs

# <VeterancyBonus kills="N" modifytype="Damage">1.5</VeterancyBonus> in a proto: from N kills on, that stat
# is multiplied by the value, in all. Repeatable. Gaia and own units do not count. Changes the simulation:
# every player needs the same setting and data. Add "log" to log the rows and the kills.
#veterancyBonus

# <TrainBatchSize>N</TrainBatchSize> in a proto limits how many of it share one Train action, instead
# of the player's limit (default 5). N is from 1; 1 means no batches. Changes the simulation: every
# player needs the same setting and data. Add "log" to log the protos and each use.
#trainBatchSize

# <Flag>HCTargetEnemy</Flag> on a tech sends its effects to the owner's enemies, and
# <Flag>HCTargetAll</Flag> to every player. The tech itself stays the owner's. Changes the
# simulation: every player needs the same setting. Add "log" to log each use.
#hcTargetTechs

# <DetonationProtoAction>Name</DetonationProtoAction> in a proto fires that action around the unit
# when it dies, through the stock area damage: the action needs DamageArea above 0. Changes the
# simulation: every player needs the same setting and data. Add "log" to log each blast.
#detonationDeath

# A tech effect type='Data' subtype='Accuracy' changes an action's <Accuracy>, with action='...' or
# allactions='1' and any relativity, on a ProtoUnit target. An action with <InstantBallistics> or
# <PerfectAccuracy> never reads it. Changes the simulation: every player needs the same setting.
# Add "log" to log each change.
#accuracyTechs

# The order in which a civ's units gather crates, first to last: Gold, Wood and Food. One line per
# civ, or "all" for every civ with no line. A civ with no line keeps the exe's order. Changes the
# simulation: every player needs the same setting. A line "cratePriority log" logs each use.
#cratePriority all Gold Wood Food
# Protos share a build limit. In a proto: <SharedBuildLimitUnit>Name</SharedBuildLimitUnit> whose
# limit applies, <SharedBuildLimitUnitType weight="N">Type</SharedBuildLimitUnitType> what counts
# toward it (repeatable), <TeamBuildLimit>1</TeamBuildLimit> the team counts. Changes the simulation:
# every player needs the same setting and data. Add "log" to log the protos and each change of room.
#sharedBuildLimit
# <DoNotQueue/> in a proto trains it ahead of what waits in the building; what was training waits
# with its progress. Changes the simulation: every player needs the same setting and data. Add
# "log" to log the protos and each move.
#doNotQueue

# A tech effect type='Data' subtype='NextResearchIsFree' on a ProtoUnit target makes the next
# research in a building of that proto free; amount is how many. SetNextResearchFree is the same
# subtype. Changes the simulation: every player needs the same setting. Add "log" to log the count.
#nextResearchFree
# A tech effect type='Data' subtype='KillBounty' (or 'Bounty') changes a proto's <Bounty>, with any
# relativity, for the owner of that proto: it changes what its killers get. Changes the simulation:
# every player needs the same setting. Add "log" to log each change.
#killBountyTechs

# <Bounty resourcetype="Gold">N</Bounty> in a proto pays N of that resource to its killer, beside the
# XP of a plain <Bounty>. Changes the simulation. Add "log" to log the tags and each payment.
#resourceBounty

# A unit whose proto has <UnitType>TeamKillBounty</UnitType> pays its bounty to the killer's whole team,
# the full amount to each. Changes the simulation. Add "log" to log each kill.
#teamKillBounty

# A unit whose proto has <UnitType>CantBeSlowed</UnitType> ignores TargetSpeedBoost attacks, and the
# <AttachSnare> of damageOverTime. Changes the simulation. Add "log" to log each snare ignored.
#cantBeSlowed

# Auras and other stat modifiers may use <ModifyType>BuildingWorkRate</ModifyType>: the
# multiplier then scales the train, research and Maintain speed of the units it reaches (stock
# reads the name as unknown and the aura does nothing). An AutoRangedModify action with
# <ModifyProtoID> or <ModifyAbstractType> picks the buildings. Works with liveBuildingWorkRate.
# Changes the simulation: every player needs the same setting. Add "log" to log each building
# whose factor changes.
buildingWorkRateAuras

# Reads the game's files through a read-ahead buffer (KB per open file) instead of millions of
# tiny reads: fewer and shorter stutters, faster loading. The game gets the same bytes, so this
# does not change the simulation and players may set it differently.
bufferedFileReads 64

# Lets this copy run while a copy of the game from another folder is running (stock allows one
# copy per machine). Add "background" to keep this copy's windows behind all others and never
# focused, for unattended tests.
multipleInstances
