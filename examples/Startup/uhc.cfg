# Example Startup\uhc.cfg for UHC.dll. Every key is explained in the modding guide:
# https://github.com/Gorgorito12/Unharcoded-AOE3--NEW/blob/main/docs/modding-guide.md
#
# Format: one key per line, then its arguments separated by spaces or tabs (UHC 1.10's
# key=value works too). Keys are case-insensitive. A line whose first word starts with # is a
# comment, and so is anything after //. A # later in a line is not a comment: its words would be
# read as arguments. Delete a line, or put # in front of it, to keep the stock behavior.
#
# The values below are examples (the ones this project tests with). Every key is implemented;
# UHC.log reports "applied" or "FAILED" for each enabled key on every start.

# --- Paths -----------------------------------------------------------------------------------
# Read the game data from the mod folder (the exe's folder), not from the install folder in the
# registry. Enable it in every mod folder that has its own data.
ignoreRegistryPath

# --- Limits ----------------------------------------------------------------------------------
# Maximum cards per deck (stock 25). The deck size of each home city level still comes from
# <maxdecksize> in homecitylevels.xml; raise it there too (see the guide).
deckCardCount 40

# Population: buildings provide at most basePop (stock 200) and techs and cards add at most
# extraPop on top (stock 50). The stock hard cap of 250 is removed.
basePop 300
extraPop 100

# List every AI3\*.personality file in game setup instead of the built-in 14.
noAILimit

# --- Home city, politicians and revolutions --------------------------------------------------
# Fame, XP and shipment costs on the politician screens, and Fame/XP icons on home city cards.
# The icons need art from the mod (see the guide).
removeFameRestriction

# A banner for every XPRevolution<Name> tech: ui\ingame\politicians\REV_banner_<Name>.
customRevolutionBanners

# --- Units -----------------------------------------------------------------------------------
# The ConvertGuardian action may target any unit, not only treasure guardians.
removeConversionRestriction

# --- Beyond UHC 1.10 -------------------------------------------------------------------------
# When the building that holds the home city shipment point is gone and no stock fallback
# building is left, use the first alive building of these protos, in this order (up to 64).
hcShipmentPointFallback Barracks Stable ArtilleryDepot Market Church

# Healers whose proto lists this unit type also heal busy units (moving, fighting or doing
# something else). The name is registered as a new abstract unit type if the data does not
# define it.
healNonIdle AbstractHealNonIdle

# Units whose proto lists this unit type can dodge hits like the Japanese monk: no damage on
# 15 % of the hits, while their player has the tech YPDodge active. The name is registered as a
# new abstract unit type if the data does not define it. Add "log" to log every dodge.
dodgeAnyUnit AbstractDodge

# The sound set a unit plays when it dodges, or when it lands a critical hit, instead of the
# stock PowerEvade / PowerCriticalStrike. One line per unit type (or proto name); the first
# matching line wins.
dodgeSoundSet AbstractDodge PowerEvade
criticalSoundSet ypMonkChinese PowerCriticalStrike

# Poison: an attack whose <ProtoAction> lists <AttachProtoUnit>X</AttachProtoUnit> keeps damaging
# what it hits, with X's Attaching action every ROF seconds for X's Lifespan. X needs a tactics
# file with an Attaching action (see the guide). Add "log" to log every poison and tick.
damageOverTime

# Train, research and Maintain speed (BuildingWorkRate) follow the proto's current value, so a
# BuildingWorkRate tech also speeds up the buildings (and ForceBuildingData units) that already
# exist; stock only speeds up the ones completed after the tech. Changes the simulation: every
# player needs the same setting. Add "log" to log each building whose rate this changes.
liveBuildingWorkRate

# Techs with <TypeCount> prerequisites (a count of the player's units) react when units are
# created or die, instead of waiting for the player's next house, age-up or tech change. A number
# checks every N world updates instead of every one. Add "log" to log every re-check and a
# summary per game minute. Without TypeCount prerequisites in the techtree it does nothing.
techPrereqRecheck

# Buildings whose proto lists this unit type keep the unit their automatic production (a Maintain
# action: factory cannons, Ottoman Town Center settlers, ...) has finished while their player is
# at the population cap, and spawn it as soon as there is room; stock throws it away and starts
# the cycle again. The name is registered as a new abstract unit type if the data does not define
# it; a proto name works too. Add "log" to log when a building starts and stops waiting.
maintainWaitForPop AbstractMaintainWaitForPop

# Units that a tech (TransformUnit) or a revolution changes into another proto take that proto's
# line of sight; stock keeps the old one. Changes the simulation: every player needs the same
# setting. Add "log" to log every unit transformed.
transformUpdatesLOS

# Ships whose proto lists this unit type (a new marker, a stock type or a proto name) fire from up
# to N muzzles per side in a broadside (BroadsideAttack actions) instead of 6; N is 1 to 255. The
# model's MuzzleR / MuzzleL points still decide how many muzzles there are, and SingleUsePlayer
# attacks keep 1. Without a unit type, every ship. Add "log" to log each broadside set-up.
broadsideMuzzleLimit 11 ypTekkousen

# How many abilities (abilities.xml) the command panel shows per unit, from 6 (stock) to 36.
# Stock asks only for the first 6 of a unit's list, so a 7th never gets a button, even when its
# tech is active and the first 6 are not. Extra buttons wrap to a second row of the Abilities
# page. Add "log" to log each button past the 6th, once per unit.
abilitySlots 12

# The wonder power panel (the global power buttons of the Asian wonders) shows a wonder's first
# available ability that is not a passive aura, so a power listed after an aura in
# abilities.xml gets its button. Stock shows only the first ability. Add "log" to log each
# ability the panel shows past the first.
wonderPanelSkipAuras

# Buildings whose proto lists this unit type start their <Lifespan> (and its AlphaFadeLifespan
# fade-out) when their construction is finished, not when the foundation is placed. The name is
# registered as a new abstract unit type if the data does not define it; "Building" applies it
# to every building with no data change. Add "log" to log every hold and start.
lifespanAfterConstruction AbstractLifespanAfterConstruction

# A socketed building (TradingPost, or a mod's building with <SocketUnitType>) may only be
# placed on a socket owned by Gaia, as the red placement preview already shows. With a unit type
# (or proto name), only sockets of that type follow the rule; without one, every socket does.
# The name is registered as a new abstract unit type if the data does not define it. Add "log"
# to log each refused order. This changes the simulation: every player needs the same line.
gaiaSocketsOnly AbstractGaiaOnlySocket

# Unit hotkeys for buildings the game has no hotkey context for (a mod's new buildings, or
# stock ones such as the Sacred Field). In DefaultKeyMapY.xml, a <context> named
# <ProtoName>Accel becomes that proto's own context: its keys work while a unit of that proto is
# selected, instead of the stock context's. A trainer that is not a building (a wagon with a
# <Train> list) enters it too. With the stock keymap nothing changes, and it does not change the
# simulation. Add "log" to log every switch to such a context.
customHotkeyContexts

# A unit hit by a snare (an attack with <TargetSpeedBoost>: 0.65x speed for 3 s) no longer slows
# the group it moves with: the group keeps its pace and does not wait for the unit while the
# snare lasts, and only the hit unit slows. After the snare, a unit left behind is waited for as
# usual. Changes the simulation: every player needs the same setting. Add "log" to log each
# snared member once per snare.
snareOnlyHitUnit

# The tech effect SetTechName: <Effect type='SetTechName' tech='T' newName='ID'
# newRolloverTextID='ID' [newLongRolloverTextID='ID']/> in a tech's <Effects> gives tech T those
# string IDs for the players the effect reaches, and only for them. WoL's key
# enableTechRenameEffect is read as this key too. Add "log" to log every rename.
techRenameEffect

# A dead unit (a hunt's carcass, a corpse) whose proto lists this unit type leaves no dopple, the
# frozen copy a player keeps seeing in the fog of war: it simply disappears from the fog. Live
# units are still doppled. Only units with <Flag>Doppled</Flag> have dopples; Huntable covers
# every hunt with no data change. Add "log" to log every skipped dopple.
noCorpseDopples Huntable

# The fire pit's Training, XPTrickle, Gathering and Regeneration dances (Fertility, Gift and
# Healing Dance, ...) work for these civs too, not only for XPIroquois, XPSioux, XPAztec and
# XPSPC. Names as in civs.xml. Nothing else about the civs changes. Changes the simulation:
# every player needs the same line. Add "log" to log each player's first use of each kind.
danceBonusCivs Spanish British

# Reads the game's files through a read-ahead buffer (KB per open file) instead of millions of
# tiny reads: fewer and shorter stutters, faster loading. The game gets the same bytes, so this
# does not change the simulation and players may set it differently.
bufferedFileReads 64

# Lets this copy run while a copy of the game from another folder is running (stock allows one
# copy per machine). Add "background" to keep this copy's windows behind all others and never
# focused, for unattended tests.
multipleInstances
